name: Set up Job Radar
description: Python 3.12 with the radar package installed.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install radar
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e .
