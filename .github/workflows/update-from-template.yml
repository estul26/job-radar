name: Update from template

# Brings the template's later fixes into your copy: its code, tests, docs and workflows, never your
# config/, résumés, data/ or reports/. It opens a pull request for you to review and merge.
# Runs only when you click Run workflow, and does nothing in the template itself.
# Optional: a TEMPLATE_UPDATE_TOKEN secret lets it update workflow files too (docs/setup.md).
# It runs this copy's own tools/update_from_template.py, which you reviewed when you merged the last
# update, so no code you haven't seen runs with your tokens. That script's own fixes arrive in the
# pull request and take effect from the next update.

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'The template to update from (owner/name)'
        type: string
        default: 'estul26/job-radar'
      script_from_template:
        description: "Only if this copy's update script is broken: run the template's latest one instead (code you haven't reviewed, with this repository's tokens)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-from-template
  cancel-in-progress: false

jobs:
  update:
    if: github.repository != 'estul26/job-radar'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # All of it: a copy's first commit holds the template version it was made from.
          fetch-depth: 0
          # GITHUB_TOKEN can't push changes to workflow files; a TEMPLATE_UPDATE_TOKEN can.
          token: ${{ secrets.TEMPLATE_UPDATE_TOKEN || github.token }}

      # Run from outside the checkout, so the script never runs a file the update itself changes.
      - name: Choose the update script
        env:
          TEMPLATE: ${{ inputs.template }}
          FROM_TEMPLATE: ${{ inputs.script_from_template }}
        run: |
          if [ "$FROM_TEMPLATE" = "true" ]; then
            git fetch --no-tags "https://github.com/$TEMPLATE.git" main
            git show FETCH_HEAD:tools/update_from_template.py > "$RUNNER_TEMP/update_from_template.py"
            echo "::warning::Running the latest update script of $TEMPLATE, not this copy's reviewed one."
          else
            cp tools/update_from_template.py "$RUNNER_TEMP/update_from_template.py"
          fi

      - name: Open a pull request with the template's changes
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_UPDATE_TOKEN || github.token }}
          TEMPLATE: ${{ inputs.template }}
          BASE: ${{ github.event.repository.default_branch }}
          HAS_TOKEN: ${{ secrets.TEMPLATE_UPDATE_TOKEN != '' }}
        run: |
          args=(--template "$TEMPLATE" --base "$BASE")
          if [ "$HAS_TOKEN" = "true" ]; then args+=(--include-workflows); fi
          python3 "$RUNNER_TEMP/update_from_template.py" "${args[@]}"
