[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar"
version = "0.1.0"
description = "Find jobs in any field twice a day, score them against your résumé, and track them as GitHub Issues."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-jobspy>=1.4,<2",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "python-docx>=1.1,<2",
  "beautifulsoup4>=4.12,<5",
]

[project.scripts]
radar = "job_radar.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# timezone.utc reads fine; not worth churning to datetime.UTC.
ignore = ["UP017"]
